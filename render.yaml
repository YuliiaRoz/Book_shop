databases:
  - name: book_shop_db
    databaseName: book_shop
    user: book_shop_user
    plan: free

services:
  # Вебсервер Django (працює через Gunicorn + WhiteNoise)
  - type: web
    name: book-shop-web
    env: python
    plan: free
    # Запускаємо лише встановлення пакетів та збір статики. Міграції краще робити вручну через Shell після запуску.
    buildCommand: "cd . && pip install -r requirements.txt && python manage.py collect-static --no-input"
    startCommand: "gunicorn book_shop.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: book_shop_db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: book-shop-redis
          property: connectionString

  # Redis (Брокер повідомлень та кеш)
  - type: redis
    name: book-shop-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Allow all connections"