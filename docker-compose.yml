services:
# 1. база даних PostgreSQL
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      # Спеціальні змінні для самого PostgreSQL
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Зберігаємо дані на жорсткий диск, щоб вони не зникли при перезапуску
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Django чекатиме, поки ця команда не скаже "База готова!"
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (для кешування)
  redis:
    image: redis:7-alpine
    restart: always

  # 3. Django-сервер
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app  # Синхронізує ваш код з макбука всередину контейнера
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: