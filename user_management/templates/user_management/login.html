{% extends 'shop/base.html' %}
{% load socialaccount %}
<div class="mt-4 text-center">
    <p>Або увійдіть за допомогою:</p>
    <a href="{% provider_login_url 'google' %}" class="btn btn-danger w-100">
        Увійти через Google
    </a>
</div>
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h4 class="mb-0">Вхід в кабінет</h4>
            </div>
            <div class="card-body">
                
                {% if form.errors %}
                    <div class="alert alert-danger">
                        Неправильний логін або пароль. Будь ласка, спробуйте ще раз!
                    </div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3">Увійти</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
